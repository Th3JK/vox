org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# Unity's exported build.gradle references this property, but supplies its value
# in the thin launcher module we discard. Without it the build fails with
# "Could not get unknown property 'unityStreamingAssets'".
#
# After exporting, check the Unity console for "The following should be added to
# your project's android/gradle.properties" and use that value. Blank is normal
# unless you use Streaming Assets.
unityStreamingAssets=
# Note: the android.builtInKotlin / android.newDsl entries below are AGP 9
# options re-added automatically by Flutter's gradle migrator on every build.
# Removing them does not stick. Both are set to false, so they are inert under
# the AGP 8.11.1 this project pins.
kotlin.incremental=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
