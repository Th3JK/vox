distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
# Gradle 8.14, not 9.x. Unity 2022.3's exported unityLibrary/build.gradle calls
# a script-level BuildIl2Cpp() method from a task's doLast and uses Project.exec
# inside it; Gradle 9 removed Project.exec and changed execution-time script
# method resolution, so the export fails with "Could not find method
# BuildIl2Cpp()". 8.14 is the newest version Flutter 3.44 accepts without
# warning and the newest combination flutter_embed_unity reports as tested.
distributionUrl=https\://services.gradle.org/distributions/gradle-8.14-all.zip
